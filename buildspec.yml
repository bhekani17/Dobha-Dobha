version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: af-south-1
    SAM_CLI_TELEMETRY: "0"
    TEMPLATE_FILE: server/infrastructure/template.yaml

phases:
  install:
    runtime-versions:
      nodejs: 22
      python: 3.11
    commands:
      - python3 -m venv /tmp/sam-cli && /tmp/sam-cli/bin/pip install --upgrade aws-sam-cli
  pre_build:
    commands:
      - npm --prefix server ci
      - npm --prefix server test
      - npm --prefix server/ecs-api ci
      - npm --prefix server/ecs-api run prisma:generate
      - npm --prefix server/ecs-api test
      - npm --prefix website ci
      - npm --prefix website run build
      - node --check server/src/items/handler.js
      - node --check server/src/orders/handler.js
      - node --check server/src/utils/response.js
      - node --check server/ecs-api/src/modules/escrow/escrow.service.js
      - node --check website/app.js
  build:
    commands:
      - /tmp/sam-cli/bin/sam validate --template-file "$TEMPLATE_FILE"
      - /tmp/sam-cli/bin/sam build --template-file "$TEMPLATE_FILE" --build-dir .aws-sam/build
