version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: af-south-1
    SAM_CLI_TELEMETRY: "0"
    STACK_NAME: dobha-marketplace-prototype-dev
    DEPLOY_AWS: "false"

phases:
  install:
    runtime-versions:
      nodejs: 22
      python: 3.11
    commands:
      - python3 -m venv /tmp/sam-cli && /tmp/sam-cli/bin/pip install aws-sam-cli==1.155.2
  pre_build:
    commands:
      - npm --prefix "${CODEBUILD_SRC_DIR:-.}/server/marketplace-prototype" ci --ignore-scripts
      - npm --prefix "${CODEBUILD_SRC_DIR:-.}/server/marketplace-prototype" test
  build:
    commands:
      - cd "${CODEBUILD_SRC_DIR:-.}" && /tmp/sam-cli/bin/sam validate --lint --region "$AWS_DEFAULT_REGION" --template-file server/marketplace-prototype/template.yaml
      - AWS_EC2_METADATA_DISABLED=true /tmp/sam-cli/bin/python "${CODEBUILD_SRC_DIR:-.}/server/marketplace-prototype/tool/verify_template.py"
      - cd "${CODEBUILD_SRC_DIR:-.}" && /tmp/sam-cli/bin/sam build --template-file server/marketplace-prototype/template.yaml --build-dir .aws-sam/build
      - |
        if [ "$DEPLOY_AWS" = "true" ]; then
          : "${SAM_BUCKET:?Set SAM_BUCKET to an existing authorized deployment artifact bucket}"
          /tmp/sam-cli/bin/sam deploy --template-file .aws-sam/build/template.yaml --stack-name "$STACK_NAME" --region "$AWS_DEFAULT_REGION" --s3-bucket "$SAM_BUCKET" --s3-prefix "$STACK_NAME" --capabilities CAPABILITY_IAM CAPABILITY_AUTO_EXPAND --no-confirm-changeset --no-fail-on-empty-changeset --parameter-overrides Stage=dev EnableSimulatedPayments=false
        fi
