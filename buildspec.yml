version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: af-south-1
    SAM_CLI_TELEMETRY: "0"
    STACK_NAME: dobha-marketplace-prototype-dev

phases:
  install:
    runtime-versions:
      nodejs: 22
      python: 3.11
    commands:
      - python3 -m venv /tmp/sam-cli
      - /tmp/sam-cli/bin/pip install --upgrade aws-sam-cli
  pre_build:
    commands:
      - cd server/marketplace-prototype && npm ci && npm test
  build:
    commands:
      - /tmp/sam-cli/bin/sam validate --lint --template-file server/marketplace-prototype/template.yaml
      - /tmp/sam-cli/bin/sam build --template-file server/marketplace-prototype/template.yaml --build-dir .aws-sam/build
  post_build:
    commands:
      - /tmp/sam-cli/bin/sam deploy --debug --template-file .aws-sam/build/template.yaml --stack-name "$STACK_NAME" --region "$AWS_DEFAULT_REGION" --resolve-s3 --capabilities CAPABILITY_IAM CAPABILITY_AUTO_EXPAND --no-confirm-changeset --no-fail-on-empty-changeset --parameter-overrides Stage=dev AllowedOrigin='*'
