version: 1.0
runtime: nodejs20
build:
  commands:
    build:
      - npm ci --omit=dev
run:
  command: node server/server.js
  network:
    port: 3000
  env:
    - name: NODE_ENV
      value: production
    - name: PORT
      value: 3000
    - name: AWS_REGION
      value: us-east-1
    - name: USERS_TABLE
      value: skytrade-users
    - name: ITEMS_TABLE
      value: skytrade-items
    - name: MESSAGES_TABLE
      value: skytrade-messages
    - name: WISHLISTS_TABLE
      value: skytrade-wishlists
    - name: CARTS_TABLE
      value: skytrade-carts
