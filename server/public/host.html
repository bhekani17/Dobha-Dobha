<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dobha Live - Host</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <div class="top">
      <h1>Dobha <span>Live</span> - Host</h1>
      <a href="/">Watch instead</a>
    </div>

    <div id="joinView" class="card">
      <form id="joinForm">
        <input id="room" placeholder="Stream name (e.g. bale-1)" required />
        <input id="identity" placeholder="Your seller name" required />
        <button type="submit">Go live</button>
        <div id="error" class="error"></div>
      </form>
    </div>

    <div id="roomView" class="hidden">
      <div class="bar">
        <span class="live">LIVE</span>
        <strong id="roomName"></strong>
        <span class="muted" id="viewerCount"></span>
        <span style="flex:1"></span>
        <button id="camBtn">Camera off</button>
        <button id="micBtn">Mute</button>
        <button id="leaveBtn" class="danger">End stream</button>
      </div>

      <!-- Host Pin Item Bar -->
      <div class="card" style="margin-bottom: 12px; padding: 12px;">
        <form id="pinForm" class="pin-form-grid" onsubmit="return false">
          <input id="pinTitle" placeholder="Item name (e.g. Nike Vintage)" required />
          <input id="pinPrice" placeholder="Price (e.g. 150)" required />
          <select id="pinSize">
            <option value="S">Size S</option>
            <option value="M" selected>Size M</option>
            <option value="L">Size L</option>
            <option value="XL">Size XL</option>
            <option value="Free Size">Free Size</option>
          </select>
          <div style="display:flex; gap:6px;">
            <button type="button" id="pinBtn">Pin Item</button>
            <button type="button" id="unpinBtn" class="secondary">Unpin</button>
          </div>
        </form>
      </div>

      <!-- Pinned Item Preview Banner -->
      <div id="pinnedBanner" class="product-banner hidden">
        <div class="product-info">
          <div class="product-title">
            <span id="productTitle">Item Title</span>
            <span id="productSize" class="product-size">M</span>
          </div>
          <div>
            <span id="productPrice" class="product-price">R 0</span>
            <span id="soldTag" class="sold-tag"></span>
          </div>
        </div>
        <button id="claimBtn" class="dobha-btn">Mark Sold</button>
      </div>

      <div class="stage">
        <div id="videos">
          <span class="muted" id="waiting">Starting camera...</span>
          <div id="reactionsOverlay" class="reactions-overlay"></div>
        </div>
        <div id="chat" class="card">
          <div id="messages"></div>
          <form id="chatForm">
            <input id="chatInput" placeholder="Say something" autocomplete="off" />
            <button type="submit">Send</button>
            <button type="button" id="heartBtn" class="heart-btn" title="Send Love">❤️</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.min.js"></script>
  <script src="live.js"></script>
  <script>
    $('joinForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      $('error').textContent = '';
      try {
        await joinLive({ room: $('room').value.trim(), identity: $('identity').value.trim(), role: 'host' });
      } catch (err) {
        $('error').textContent = err.message;
      }
    });

    $('camBtn').addEventListener('click', async () => {
      const on = room.localParticipant.isCameraEnabled;
      await room.localParticipant.setCameraEnabled(!on);
      $('camBtn').textContent = on ? 'Camera on' : 'Camera off';
    });

    $('micBtn').addEventListener('click', async () => {
      const on = room.localParticipant.isMicrophoneEnabled;
      await room.localParticipant.setMicrophoneEnabled(!on);
      $('micBtn').textContent = on ? 'Unmute' : 'Mute';
    });

    $('pinBtn').addEventListener('click', () => {
      const title = $('pinTitle').value.trim();
      const price = $('pinPrice').value.trim();
      const size = $('pinSize').value;
      if (!title || !price) return;
      currentPinnedItem = {
        id: Date.now().toString(),
        title,
        price: price.startsWith('R') ? price : 'R ' + price,
        size,
        status: 'available',
      };
      renderPinnedItem();
      broadcastData({ type: 'pin_item', item: currentPinnedItem });
      addSystemMessage(`📢 You pinned: ${title} (${currentPinnedItem.price})`);
    });

    $('unpinBtn').addEventListener('click', () => {
      currentPinnedItem = null;
      renderPinnedItem();
      broadcastData({ type: 'unpin_item' });
      addSystemMessage('Item unpinned');
    });
  </script>
</body>
</html>
