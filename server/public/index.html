<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dobha Live</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <div class="top">
      <h1>Dobha <span>Live</span></h1>
      <a href="/host.html">Go live</a>
    </div>

    <div id="joinView">
      <div class="card">
        <form onsubmit="return false">
          <input id="identity" placeholder="Your name" required />
        </form>
      </div>
      <h2>Live now</h2>
      <div id="roomList"></div>
      <div id="error" class="error"></div>
    </div>

    <div id="roomView" class="hidden">
      <div class="bar">
        <span class="live">LIVE</span>
        <strong id="roomName"></strong>
        <span class="muted" id="viewerCount"></span>
        <span style="flex:1"></span>
        <button id="leaveBtn" class="danger">Leave</button>
      </div>
      <div class="stage">
        <div id="videos"><span class="muted" id="waiting">Waiting for host...</span></div>
        <div id="chat" class="card">
          <div id="messages"></div>
          <form id="chatForm">
            <input id="chatInput" placeholder="Say something" autocomplete="off" />
            <button type="submit">Send</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.min.js"></script>
  <script src="live.js"></script>
  <script>
    let pollTimer;

    async function loadRooms() {
      try {
        const res = await fetch('/rooms');
        const rooms = await res.json();
        if (!res.ok) throw new Error(rooms.error);
        $('error').textContent = '';
        renderRooms(rooms);
      } catch (err) {
        $('error').textContent = err.message || 'Could not load streams';
      }
    }

    function renderRooms(rooms) {
      const list = $('roomList');
      list.innerHTML = '';
      if (!rooms.length) {
        list.innerHTML = '<div class="card muted">Nobody is live right now.</div>';
        return;
      }
      rooms.forEach((r) => {
        const item = document.createElement('div');
        item.className = 'card roomItem';
        const info = document.createElement('div');
        const name = document.createElement('strong');
        name.textContent = r.name;
        const count = document.createElement('div');
        count.className = 'muted';
        count.textContent = r.viewers + (r.viewers === 1 ? ' viewer' : ' viewers');
        info.append(name, count);
        const btn = document.createElement('button');
        btn.textContent = 'Watch';
        btn.onclick = () => watch(r.name);
        item.append(info, btn);
        list.appendChild(item);
      });
    }

    async function watch(roomName) {
      const identity = $('identity').value.trim();
      if (!identity) {
        $('identity').focus();
        $('error').textContent = 'Enter your name first';
        return;
      }
      $('error').textContent = '';
      try {
        clearInterval(pollTimer);
        await joinLive({ room: roomName, identity, role: 'viewer' });
      } catch (err) {
        $('error').textContent = err.message;
        startPolling();
      }
    }

    function startPolling() {
      loadRooms();
      pollTimer = setInterval(loadRooms, 5000);
    }

    document.addEventListener('live:left', startPolling);
    startPolling();
  </script>
</body>
</html>
