AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Deprecated incomplete Lambda/RDS alternative; not the approved production target

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
    Description: Deployment stage

  AllowedOrigin:
    Type: String
    AllowedPattern: '^https?://[A-Za-z0-9.-]+(:[0-9]{1,5})?$'
    ConstraintDescription: Provide exactly one HTTP or HTTPS website origin without a path or wildcard.
    Description: A single trusted website origin for API CORS.

  AdminEmails:
    Type: String
    Default: 'ndlovubhekani17@gmail.com'
    Description: Comma-separated admin emails

  GoogleClientId:
    Type: String
    Default: '787923055628-acjg6j5smm778vt2b3mtcss6so61niaj.apps.googleusercontent.com'
    Description: Google OAuth client ID

  DBUsername:
    Type: String
    Default: 'dobha_admin'
    Description: RDS database username

  DBPassword:
    Type: String
    NoEcho: true
    MinLength: 16
    MaxLength: 41
    Description: Required database password; supply securely and never commit it.

  DBName:
    Type: String
    Default: 'dobha'
    Description: RDS database name

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 30
    MemorySize: 512
    Environment:
      Variables:
        STAGE: !Ref Stage
        ADMIN_EMAILS: !Ref AdminEmails
        GOOGLE_CLIENT_IDS: !Ref GoogleClientId
        ALLOWED_WEB_ORIGINS: !Ref AllowedOrigin
        DB_HOST: !GetAtt RDSInstance.Endpoint.Address
        DB_PORT: !GetAtt RDSInstance.Endpoint.Port
        DB_NAME: !Ref DBName
        DB_USER: !Ref DBUsername
        PHOTOS_BUCKET: !Ref PhotosBucket

Resources:
  # ============================================
  # VPC for RDS
  # ============================================
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub '${Stage}-dobha-vpc'

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${Stage}-dobha-igw'

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${Stage}-dobha-public-subnet-1'

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${Stage}-dobha-public-subnet-2'

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.3.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${Stage}-dobha-private-subnet-1'

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.4.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${Stage}-dobha-private-subnet-2'

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${Stage}-dobha-public-rt'

  PublicRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  # ============================================
  # Security Groups
  # ============================================
  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Lambda functions
      VpcId: !Ref VPC
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${Stage}-dobha-lambda-sg'

  RDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for RDS instance
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref LambdaSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub '${Stage}-dobha-rds-sg'
      DependsOn: LambdaSecurityGroup

  # ============================================
  # RDS PostgreSQL Database
  # ============================================
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnet group for RDS instance
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      Tags:
        - Key: Name
          Value: !Sub '${Stage}-dobha-db-subnet-group'

  RDSInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: !Sub '${Stage}-dobha-db'
      DBInstanceClass: db.t3.micro
      Engine: postgres
      EngineVersion: '15.4'
      AllocatedStorage: '20'
      StorageType: gp2
      StorageEncrypted: true
      MasterUsername: !Ref DBUsername
      MasterUserPassword: !Ref DBPassword
      DBName: !Ref DBName
      VPCSecurityGroups:
        - !Ref RDSSecurityGroup
      DBSubnetGroupName: !Ref DBSubnetGroup
      BackupRetentionPeriod: 7
      MultiAZ: false
      PubliclyAccessible: false
      DeletionProtection: true
      Tags:
        - Key: Name
          Value: !Sub '${Stage}-dobha-rds'

  # ============================================
  # Cognito User Pool
  # ============================================
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${Stage}-dobha-users'
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
      MfaConfiguration: OFF
      Schema:
        - AttributeName: email
          AttributeType: String
          Required: true
          Mutable: true
        - AttributeName: name
          AttributeType: String
          Required: true
          Mutable: true
        - AttributeName: phone_number
          AttributeType: String
          Required: false
          Mutable: true

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub '${Stage}-dobha-web'
      GenerateSecret: false
      AuthFlows:
        - USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - email
        - openid
        - profile
      SupportedIdentityProviders:
        - COGNITO
        - Google
      CallbackURLs:
        - !Ref AllowedOrigin

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub '${Stage}-dobha-${AWS::AccountId}'
      UserPoolId: !Ref UserPool

  # ============================================
  # Cognito Identity Provider (Google)
  # ============================================
  GoogleIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        authorize_scopes: 'email profile'
        client_id: !Ref GoogleClientId
        client_secret: '{{resolve:secretsmanager:GoogleClientSecret}}'

  # ============================================
  # S3 Buckets
  # ============================================
  PhotosBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${Stage}-dobha-photos'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: CleanupUnattached
            Status: Enabled
            ExpirationInDays: 7
            NoncurrentVersionExpirationInDays: 1
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  WebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${Stage}-dobha-website'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled

  WebsiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${Stage}-dobha-website-oac'
        Description: Private S3 access for the website distribution
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  WebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyDocument:
        Statement:
          - Sid: AllowCloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${WebsiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${WebsiteDistribution}'

  # ============================================
  # API Gateway
  # ============================================
  Api:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Stage

  # ============================================
  # Lambda Function
  # ============================================
  ApiLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${Stage}-dobha-api'
      Handler: src/lambda-wrapper.handler
      CodeUri: ../
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - !Ref PrivateSubnet1
          - !Ref PrivateSubnet2
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref PhotosBucket
        - Statement:
            Effect: Allow
            Action:
              - rds-db:connect
            Resource: !Sub 'arn:aws:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${RDSInstance.Endpoint.Address}/${DBName}/${DBUsername}'
        - Statement:
            Effect: Allow
            Action:
              - ses:SendEmail
              - ses:SendRawEmail
            Resource: '*'
        - Statement:
            Effect: Allow
            Action:
              - sns:Publish
            Resource: !Ref PushTopic
        - Statement:
            Effect: Allow
            Action:
              - sqs:SendMessage
              - sqs:ReceiveMessage
              - sqs:DeleteMessage
              - sqs:GetQueueAttributes
            Resource:
              - !GetAtt PushQueue.Arn
              - !GetAtt PushDLQ.Arn
        - Statement:
            Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
            Resource: '*'
      Environment:
        Variables:
          DB_PASSWORD: !Ref DBPassword
          STAGE: !Ref Stage
          ADMIN_EMAILS: !Ref AdminEmails
          GOOGLE_CLIENT_IDS: !Ref GoogleClientId
          ALLOWED_WEB_ORIGINS: !Ref AllowedOrigin
          DB_HOST: !GetAtt RDSInstance.Endpoint.Address
          DB_PORT: !GetAtt RDSInstance.Endpoint.Port
          DB_NAME: !Ref DBName
          DB_USER: !Ref DBUsername
          PHOTOS_BUCKET: !Ref PhotosBucket
          PUSH_QUEUE_URL: !Ref PushQueue
          PUSH_TOPIC_ARN: !Ref PushTopic
          USER_POOL_ID: !Ref UserPool
          USER_POOL_CLIENT_ID: !Ref UserPoolClient
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: ANY
            RestApiId: !Ref Api

  # ============================================
  # SQS Queue for Push Notifications
  # ============================================
  PushQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${Stage}-dobha-push-queue'
      VisibilityTimeout: 300
      MessageRetentionPeriod: 86400
      DeadLetterTargetArn: !GetAtt PushDLQ.Arn
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt PushDLQ.Arn
        maxReceiveCount: 3

  PushDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${Stage}-dobha-push-dlq'
      MessageRetentionPeriod: 1209600

  # ============================================
  # SNS Topic for Push Notifications
  # ============================================
  PushTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${Stage}-dobha-push'

  # ============================================
  # Database Migration Lambda
  # ============================================
  MigrationLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${Stage}-dobha-db-migration'
      Handler: src/migrate.handler
      CodeUri: ../
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - !Ref PrivateSubnet1
          - !Ref PrivateSubnet2
      Policies:
        - Statement:
            Effect: Allow
            Action:
              - rds-db:connect
            Resource: !Sub 'arn:aws:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${RDSInstance.Endpoint.Address}/${DBName}/${DBUsername}'
      Environment:
        Variables:
          DB_PASSWORD: !Ref DBPassword
          DB_HOST: !GetAtt RDSInstance.Endpoint.Address
          DB_PORT: !GetAtt RDSInstance.Endpoint.Port
          DB_NAME: !Ref DBName
          DB_USER: !Ref DBUsername

  # ============================================
  # CloudFront Distribution for API
  # ============================================
  ApiDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Origins:
          - Id: ApiOrigin
            DomainName: !Sub '${Api}.execute-api.${AWS::Region}.amazonaws.com'
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
        DefaultCacheBehavior:
          TargetOriginId: ApiOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          ForwardedValues:
            QueryString: true
            Headers:
              - Authorization
              - Content-Type
            Cookies:
              Forward: all
          Compress: true
          MinTTL: 0
          DefaultTTL: 0
          MaxTTL: 0
        PriceClass: PriceClass_All
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

  # ============================================
  # CloudFront Distribution for Website
  # ============================================
  WebsiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt WebsiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt WebsiteOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
          Compress: true
        PriceClass: PriceClass_All
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.amazonaws.com/${Stage}'

  ApiDistributionDomain:
    Description: CloudFront distribution domain for API
    Value: !GetAtt ApiDistribution.DomainName

  WebsiteDistributionDomain:
    Description: CloudFront distribution domain for website
    Value: !GetAtt WebsiteDistribution.DomainName

  WebsiteBucketName:
    Description: S3 bucket name for website
    Value: !Ref WebsiteBucket

  PhotosBucketName:
    Description: S3 bucket name for photos
    Value: !Ref PhotosBucket

  RDSEndpoint:
    Description: RDS instance endpoint
    Value: !GetAtt RDSInstance.Endpoint.Address

  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UserPool

  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref UserPoolClient
