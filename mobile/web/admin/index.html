<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Dobha Admin</title>
  <link rel="icon" href="/favicon.png">
  <script src="https://accounts.google.com/gsi/client" async></script>
  <style>
    :root {
      /* Black, white and green; red only for problems and destructive actions. */
      --bg: #000000; --surface: #121212; --well: #0a0a0a; --raised: #1f1f1f;
      --text: #ffffff; --text2: #bdbdbd; --muted: #8a8a8a; --border: #1f1f1f;
      --green: #00a93b; --green-ink: #000000; --red: #ff453a; --amber: #bdbdbd; --cyan: #00a93b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    button { font: inherit; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    .wrap { max-width: 1180px; margin: 0 auto; padding: 0 24px; }

    /* Header */
    header { border-bottom: 1px solid var(--border); background: var(--surface); position: sticky; top: 0; z-index: 5; }
    header .wrap { display: flex; align-items: center; gap: 14px; height: 64px; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; }
    .brand img { width: 32px; height: 32px; border-radius: 8px; }
    .brand span { color: var(--green); }
    .spacer { flex: 1; }
    .who { color: var(--muted); font-size: 13px; }

    /* Buttons */
    .btn { border: 0; border-radius: 10px; padding: 9px 16px; font-weight: 700; background: var(--raised); color: var(--text); }
    .btn:hover:not(:disabled) { filter: brightness(1.12); }
    .btn.green { background: var(--green); color: var(--green-ink); }
    .btn.red { background: var(--red); color: #fff; }
    .btn.ghost { background: transparent; color: var(--muted); }
    .btn.ghost:hover { color: var(--text); }

    /* Tabs */
    .bar { display: flex; align-items: center; gap: 8px; margin: 28px 0 20px; flex-wrap: wrap; }
    .tab { border: 0; border-radius: 999px; padding: 9px 18px; background: var(--surface); color: var(--text2); font-weight: 700; }
    .tab[aria-selected="true"] { background: color-mix(in srgb, var(--green) 16%, var(--surface)); color: var(--green); }
    .count { display: inline-block; min-width: 22px; margin-left: 6px; padding: 0 7px; border-radius: 999px; background: var(--raised); color: var(--text); font-size: 12px; text-align: center; }
    .tab[aria-selected="true"] .count { background: var(--green); color: var(--green-ink); }
    .updated { color: var(--muted); font-size: 12px; }

    /* Cards */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; padding-bottom: 48px; }
    .card { background: var(--surface); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
    .head { display: flex; gap: 14px; align-items: flex-start; }
    .thumb { width: 72px; height: 72px; border-radius: 12px; background: var(--well); object-fit: cover; flex: none; display: grid; place-items: center; color: var(--muted); font-size: 11px; }
    a.thumb:hover { outline: 2px solid var(--green); }
    .title { font-weight: 700; font-size: 15px; margin: 0 0 2px; }
    .sub { color: var(--muted); font-size: 12px; }
    .price { margin-left: auto; font-weight: 700; font-size: 18px; color: var(--green); white-space: nowrap; }
    dl { display: grid; grid-template-columns: 88px 1fr; gap: 4px 10px; margin: 0; font-size: 13px; }
    dt { color: var(--muted); }
    dd { margin: 0; color: var(--text2); overflow-wrap: anywhere; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag { border-radius: 8px; padding: 3px 9px; font-size: 12px; font-weight: 700; background: color-mix(in srgb, var(--amber) 16%, transparent); color: var(--amber); }
    .tag.red { background: color-mix(in srgb, var(--red) 16%, transparent); color: var(--red); }
    .desc { color: var(--text2); font-size: 13px; background: var(--well); border-radius: 10px; padding: 10px 12px; white-space: pre-wrap; }
    .actions { display: flex; gap: 10px; margin-top: auto; }
    .actions .btn { flex: 1; padding: 11px; }

    /* States */
    .empty { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 80px 20px; background: var(--surface); border-radius: 18px; }
    .empty strong { display: block; color: var(--text); font-size: 16px; margin-bottom: 4px; }

    /* Sign in */
    .login { max-width: 380px; margin: 12vh auto 0; background: var(--surface); border-radius: 20px; padding: 32px; }
    .login h1 { margin: 16px 0 4px; font-size: 22px; }
    .login p { margin: 0 0 22px; color: var(--muted); }
    .login img { width: 56px; height: 56px; border-radius: 14px; }
    .field { display: block; margin-bottom: 12px; }
    .field span { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
    .field input { width: 100%; padding: 11px 13px; border-radius: 10px; border: 1px solid var(--border); background: var(--well); color: var(--text); font: inherit; }
    .field input:focus { outline: none; border-color: var(--green); }
    .field textarea { width: 100%; padding: 11px 13px; border-radius: 10px; border: 1px solid var(--border); background: var(--well); color: var(--text); font: inherit; resize: vertical; }
    .field textarea:focus { outline: none; border-color: var(--green); }
    .login .btn.green { width: 100%; padding: 12px; margin-top: 4px; }
    .or { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; margin: 18px 0; }
    .or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--border); }
    #google { min-height: 44px; display: flex; justify-content: center; }
    .error { color: var(--red); font-size: 13px; min-height: 20px; margin-top: 10px; }

    /* Dialog and toast */
    dialog { border: 0; border-radius: 18px; padding: 24px; width: min(420px, calc(100vw - 32px)); background: var(--surface); color: var(--text); }
    dialog::backdrop { background: rgb(0 0 0 / .6); }
    dialog h2 { margin: 0 0 8px; font-size: 18px; }
    dialog p { margin: 0 0 20px; color: var(--text2); }
    dialog .actions .btn { flex: none; padding: 10px 18px; }
    dialog .actions { justify-content: flex-end; }
    #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--raised); color: var(--text); padding: 11px 18px; border-radius: 12px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .2s; }
    #toast.show { opacity: 1; }

    @media (max-width: 600px) {
      .wrap { padding: 0 16px; }
      .who { display: none; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <dialog id="confirm">
    <h2 id="confirm-title"></h2>
    <p id="confirm-body"></p>
    <div class="actions">
      <button class="btn ghost" value="cancel" id="confirm-cancel">Cancel</button>
      <button class="btn" id="confirm-ok"></button>
    </div>
  </dialog>
  <div id="toast" role="status"></div>

  <script>
    // Admin console for Dobha Dobha: settle disputed orders and review reported listings.
    // Talks to the same API as the app; the server only lets ADMIN_EMAILS accounts use /api/admin.
    const GOOGLE_CLIENT_ID = '787923055628-acjg6j5smm778vt2b3mtcss6so61niaj.apps.googleusercontent.com';
    const TOKEN_KEY = 'dobha_admin_token';
    const REFRESH_MS = 60_000;

    const state = { token: null, user: null, tab: 'disputes', disputes: [], reports: [], support: [], updatedAt: null, busy: false };
    const TOPICS = { order: 'An order', payment: 'Payments or wallet', selling: 'Selling', account: 'Account', safety: 'Safety or a scam', bug: 'Something not working', other: 'Something else' };
    const app = document.getElementById('app');

    // ---- helpers ----

    /** Builds an element; strings become text nodes, so nothing is parsed as HTML. */
    function h(tag, attrs = {}, ...children) {
      const el = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs)) {
        if (v == null || v === false) continue;
        if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
        else if (k === 'class') el.className = v;
        else el.setAttribute(k, v === true ? '' : v);
      }
      for (const c of children.flat(Infinity)) if (c != null && c !== false) el.append(c instanceof Node ? c : String(c));
      return el;
    }

    const rands = (n) => `R ${Number(n).toLocaleString('en-ZA', { maximumFractionDigits: 0 })}`;
    const date = (iso) => (iso ? new Date(iso).toLocaleString('en-ZA', { dateStyle: 'medium', timeStyle: 'short' }) : '');

    function storage(op, value) {
      try {
        if (op === 'get') return localStorage.getItem(TOKEN_KEY);
        if (op === 'set') localStorage.setItem(TOKEN_KEY, value);
        if (op === 'del') localStorage.removeItem(TOKEN_KEY);
      } catch {}
      return null;
    }

    let toastTimer;
    function toast(text) {
      const t = document.getElementById('toast');
      t.textContent = text;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
    }

    function confirmDialog({ title, body, action, danger }) {
      const d = document.getElementById('confirm');
      document.getElementById('confirm-title').textContent = title;
      document.getElementById('confirm-body').textContent = body;
      const ok = document.getElementById('confirm-ok');
      ok.textContent = action;
      ok.className = `btn ${danger ? 'red' : 'green'}`;
      return new Promise((resolve) => {
        const done = (v) => { d.close(); ok.onclick = null; document.getElementById('confirm-cancel').onclick = null; resolve(v); };
        ok.onclick = () => done(true);
        document.getElementById('confirm-cancel').onclick = () => done(false);
        d.onclose = () => resolve(false);
        d.showModal();
      });
    }

    async function api(method, path, body) {
      const res = await fetch(path, {
        method,
        headers: { ...(body ? { 'content-type': 'application/json' } : {}), ...(state.token ? { authorization: `Bearer ${state.token}` } : {}) },
        body: body ? JSON.stringify(body) : undefined,
      });
      const data = await res.json().catch(() => null);
      if (res.status === 401 && state.token) signOut('Your session expired, sign in again.');
      if (!res.ok) throw new Error(data?.error || `Request failed (${res.status})`);
      return data;
    }

    // ---- session ----

    async function startSession(token, user) {
      state.token = token;
      state.user = user;
      storage('set', token);
      if (!user.isAdmin) return renderLogin(`${user.email} is not an admin account.`);
      render();
      await load();
    }

    async function signOut(message) {
      if (state.token) fetch('/api/auth/logout', { method: 'POST', headers: { authorization: `Bearer ${state.token}` } }).catch(() => {});
      state.token = null;
      state.user = null;
      storage('del');
      renderLogin(message);
    }

    // ---- data ----

    async function load() {
      if (!state.user?.isAdmin || state.busy) return;
      state.busy = true;
      try {
        const [d, r, s] = await Promise.all([api('GET', '/api/admin/disputes'), api('GET', '/api/admin/reports'), api('GET', '/api/admin/support')]);
        state.disputes = d.orders;
        state.reports = r.items;
        state.support = s.requests;
        state.updatedAt = new Date();
        render();
      } catch (e) {
        if (state.user) toast(e.message);
      } finally {
        state.busy = false;
      }
    }

    async function act(button, request, done) {
      button.disabled = true;
      try {
        await request();
        toast(done);
        await load();
      } catch (e) {
        toast(e.message);
        button.disabled = false;
      }
    }

    // ---- views ----

    function renderLogin(error = '') {
      app.replaceChildren(
        h('div', { class: 'wrap' },
          h('form', {
            class: 'login',
            onsubmit: async (e) => {
              e.preventDefault();
              const f = e.target;
              const err = f.querySelector('.error');
              f.querySelector('button').disabled = true;
              err.textContent = '';
              try {
                const res = await api('POST', '/api/auth/login', { email: f.email.value, password: f.password.value });
                await startSession(res.token, res.user);
              } catch (x) {
                err.textContent = x.message;
                f.querySelector('button').disabled = false;
              }
            },
          },
            h('img', { src: '/icons/Icon-192.png', alt: '' }),
            h('h1', {}, 'Dobha Admin'),
            h('p', {}, 'Settle disputes, review reported listings and answer support questions.'),
            h('div', { id: 'google' }),
            h('div', { class: 'or' }, 'or with email'),
            h('label', { class: 'field' }, h('span', {}, 'Email'), h('input', { name: 'email', type: 'email', autocomplete: 'username', required: true })),
            h('label', { class: 'field' }, h('span', {}, 'Password'), h('input', { name: 'password', type: 'password', autocomplete: 'current-password', required: true })),
            h('button', { class: 'btn green', type: 'submit' }, 'Sign in'),
            h('div', { class: 'error', role: 'alert' }, error),
          ),
        ),
      );
      renderGoogleButton();
    }

    function renderGoogleButton() {
      const el = document.getElementById('google');
      if (!el) return;
      if (!window.google?.accounts?.id) return setTimeout(renderGoogleButton, 200);
      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: async ({ credential }) => {
          const err = document.querySelector('.login .error');
          try {
            const res = await api('POST', '/api/auth/google', { idToken: credential });
            await startSession(res.token, res.user);
          } catch (x) {
            if (err) err.textContent = x.message;
          }
        },
      });
      google.accounts.id.renderButton(el, { theme: 'filled_black', size: 'large', shape: 'pill', text: 'signin_with', width: 316 });
    }

    function render() {
      const tabs = [
        ['disputes', 'Disputes', state.disputes.length],
        ['reports', 'Reported listings', state.reports.length],
        ['support', 'Support', state.support.length],
      ];
      const cards = { disputes: disputeCards, reports: reportCards, support: supportCards }[state.tab];
      app.replaceChildren(
        h('header', {},
          h('div', { class: 'wrap' },
            h('div', { class: 'brand' }, h('img', { src: '/icons/Icon-192.png', alt: '' }), 'Dobha ', h('span', {}, 'Admin')),
            h('div', { class: 'spacer' }),
            h('span', { class: 'who' }, state.user.email),
            h('button', { class: 'btn ghost', onclick: () => signOut() }, 'Sign out'),
          ),
        ),
        h('main', { class: 'wrap' },
          h('div', { class: 'bar', role: 'tablist' },
            tabs.map(([id, label, n]) =>
              h('button', { class: 'tab', role: 'tab', 'aria-selected': String(state.tab === id), onclick: () => { state.tab = id; render(); } },
                label, h('span', { class: 'count' }, n))),
            h('div', { class: 'spacer' }),
            state.updatedAt && h('span', { class: 'updated' }, `Updated ${state.updatedAt.toLocaleTimeString('en-ZA', { timeStyle: 'short' })}`),
            h('button', { class: 'btn', onclick: (e) => { e.target.disabled = true; load().finally(() => (e.target.disabled = false)); } }, 'Refresh'),
          ),
          h('div', { class: 'grid' }, cards()),
        ),
      );
    }

    function thumb(item) {
      return item.photoUrl
        ? h('a', { class: 'thumb', href: item.photoUrl, target: '_blank', rel: 'noopener', title: 'Open photo' }, h('img', { class: 'thumb', src: item.photoUrl, alt: '' }))
        : h('div', { class: 'thumb' }, 'No photo');
    }

    function disputeCards() {
      if (!state.disputes.length) return h('div', { class: 'empty' }, h('strong', {}, 'No open disputes'), 'When a buyer reports a problem with an order it shows up here.');
      return state.disputes.map((o) =>
        h('article', { class: 'card' },
          h('div', { class: 'head' },
            thumb(o.item),
            h('div', {}, h('p', { class: 'title' }, o.item.title), h('div', { class: 'sub' }, `#${o.id}`), h('div', { class: 'sub' }, `Ordered ${date(o.createdAt)}`)),
            h('div', { class: 'price' }, rands(o.amountZar + o.shippingFeeZar)),
          ),
          h('dl', {},
            h('dt', {}, 'Buyer'), h('dd', {}, o.buyerName),
            h('dt', {}, 'Seller'), h('dd', {}, `${o.item.sellerName} (${o.item.sellerHandle})`),
            h('dt', {}, 'Item'), h('dd', {}, `${rands(o.amountZar)} + ${rands(o.shippingFeeZar)} delivery`),
            h('dt', {}, 'Delivery'), h('dd', {}, o.deliveryMethod),
            h('dt', {}, 'Address'), h('dd', {}, o.deliveryAddress),
            h('dt', {}, 'Tracking'), h('dd', {}, o.trackingNumber || 'Not dispatched'),
            h('dt', {}, 'Dispatched'), h('dd', {}, o.dispatchedAt ? date(o.dispatchedAt) : 'No'),
            h('dt', {}, 'Paid with'), h('dd', {}, o.paymentMethod),
          ),
          h('div', { class: 'actions' },
            h('button', {
              class: 'btn red',
              onclick: async (e) => {
                const btn = e.currentTarget;
                if (await confirmDialog({ title: 'Refund the buyer?', body: `${rands(o.amountZar + o.shippingFeeZar)} goes back to ${o.buyerName}'s Dobha wallet. The seller is not paid.`, action: 'Refund buyer', danger: true }))
                  act(btn, () => api('POST', `/api/orders/${o.id}/resolve`, { outcome: 'refund' }), 'Buyer refunded');
              },
            }, 'Refund buyer'),
            h('button', {
              class: 'btn green',
              onclick: async (e) => {
                const btn = e.currentTarget;
                if (await confirmDialog({ title: 'Pay the seller?', body: `${o.item.sellerName} gets ${rands(o.amountZar * 0.95)} (the price minus the 5% Dobha fee). The buyer is not refunded.`, action: 'Pay seller' }))
                  act(btn, () => api('POST', `/api/orders/${o.id}/resolve`, { outcome: 'release' }), 'Seller paid');
              },
            }, 'Pay seller'),
          ),
        ));
    }

    function reportCards() {
      if (!state.reports.length) return h('div', { class: 'empty' }, h('strong', {}, 'No reported listings'), 'Listings users report as fake, misleading or a scam show up here.');
      return state.reports.map((it) =>
        h('article', { class: 'card' },
          h('div', { class: 'head' },
            thumb(it),
            h('div', {}, h('p', { class: 'title' }, it.title), h('div', { class: 'sub' }, `${it.sellerName} (${it.sellerHandle})`), h('div', { class: 'sub' }, `${it.category} · Size ${it.size} · ${it.condition}`)),
            h('div', { class: 'price' }, rands(it.priceZar)),
          ),
          h('div', { class: 'tags' },
            h('span', { class: 'tag red' }, `${it.reports} report${it.reports === 1 ? '' : 's'}`),
            it.reportReasons.map((r) => h('span', { class: 'tag' }, r)),
          ),
          (it.description || it.haulCaption) && h('div', { class: 'desc' }, it.description || it.haulCaption),
          it.media.length > 1 && h('div', { class: 'sub' }, `${it.media.length} photos and videos: `,
            it.media.map((m, i) => [i ? ', ' : '', h('a', { href: m.url, target: '_blank', rel: 'noopener', style: 'color: var(--cyan)' }, `${m.kind} ${i + 1}`)])),
          h('div', { class: 'actions' },
            h('button', {
              class: 'btn',
              onclick: (e) => act(e.currentTarget, () => api('POST', `/api/admin/items/${it.id}/dismiss`), 'Reports cleared, listing kept'),
            }, 'Keep listing'),
            h('button', {
              class: 'btn red',
              onclick: async (e) => {
                const btn = e.currentTarget;
                if (await confirmDialog({ title: 'Remove this listing?', body: `"${it.title}" disappears for everyone and ${it.sellerName} is told it was removed after reports.`, action: 'Remove listing', danger: true }))
                  act(btn, () => api('POST', `/api/admin/items/${it.id}/remove`), 'Listing removed');
              },
            }, 'Remove'),
          ),
        ));
    }

    function supportCards() {
      if (!state.support.length) return h('div', { class: 'empty' }, h('strong', {}, 'No open questions'), 'Questions people send from Help in the app show up here.');
      return state.support.map((q) => {
        const reply = h('textarea', { rows: 4, maxlength: 2000, placeholder: q.userName ? 'Your answer. They get it as a notification in the app.' : 'Your answer.' });
        return h('article', { class: 'card' },
          h('div', { class: 'head' },
            h('div', {},
              h('p', { class: 'title' }, TOPICS[q.topic] || q.topic),
              h('div', { class: 'sub' }, `Sent ${date(q.createdAt)}`),
            ),
          ),
          h('dl', {},
            h('dt', {}, 'From'), h('dd', {}, q.userName ? `${q.userName} (${q.userHandle})` : 'Not signed in'),
            h('dt', {}, 'Email'), h('dd', {}, h('a', { href: `mailto:${q.email}`, style: 'color: var(--cyan)' }, q.email)),
            q.orderId && [h('dt', {}, 'Order'), h('dd', {}, `#${q.orderId}`)],
          ),
          h('div', { class: 'desc' }, q.message),
          !q.userName && h('div', { class: 'sub' }, 'They wrote in signed out. If email sending is not set up yet, answer them by email as well.'),
          h('label', { class: 'field' }, reply),
          h('div', { class: 'actions' },
            h('button', {
              class: 'btn',
              onclick: async (e) => {
                const btn = e.currentTarget;
                if (await confirmDialog({ title: 'Close without answering?', body: 'Use this for spam or questions already answered another way.', action: 'Close' }))
                  act(btn, () => api('POST', `/api/admin/support/${q.id}/close`), 'Closed');
              },
            }, 'Close'),
            h('button', {
              class: 'btn green',
              onclick: (e) => {
                if (reply.value.trim().length < 2) return toast('Write an answer first');
                act(e.currentTarget, () => api('POST', `/api/admin/support/${q.id}/reply`, { reply: reply.value.trim() }), 'Answer sent');
              },
            }, 'Send answer'),
          ),
        );
      });
    }

    // ---- start ----

    (async () => {
      state.token = storage('get');
      if (!state.token) return renderLogin();
      try {
        const { user } = await api('GET', '/api/me');
        await startSession(state.token, user);
      } catch {
        renderLogin();
      }
    })();

    // Refreshing re-renders the cards, so hold off while a support answer is half written.
    const drafting = () => [...document.querySelectorAll('textarea')].some((t) => t.value.trim());
    setInterval(() => { if (!document.hidden && !drafting()) load(); }, REFRESH_MS);
    document.addEventListener('visibilitychange', () => { if (!document.hidden && !drafting()) load(); });
  </script>
</body>
</html>
